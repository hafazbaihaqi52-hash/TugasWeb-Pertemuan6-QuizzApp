<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Interactive Quiz App menggunakan JavaScript DOM dan LocalStorage"
    >

    <title>Interactive Quiz App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="quiz-card">

            <header class="quiz-header">
                <h1>🧠 Interactive Quiz</h1>

                <p>
                    Uji pengetahuanmu tentang Pemrograman Web
                </p>
            </header>


            <!-- Bagian Quiz -->
            <section id="quizContent" class="quiz-content">

                <!-- Progress -->
                <div class="progress-info">
                    <span id="progress">Soal 1/5</span>
                </div>


                <!-- Soal -->
                <div class="question-box">
                    <h2 id="question"></h2>
                </div>


                <!-- Pilihan Jawaban -->
                <div
                    id="options"
                    class="options-grid"
                ></div>


                <!-- Feedback -->
                <p
                    id="feedback"
                    class="feedback"
                ></p>


                <!-- Tombol Next -->
                <button
                    id="nextBtn"
                    class="next-btn hidden"
                >
                    Soal Berikutnya →
                </button>

            </section>


            <!-- Hasil Quiz -->
            <section
                id="result"
                class="result hidden"
            >

                <h2>🎉 Quiz Selesai!</h2>

                <p class="score-text">
                    Skor Kamu:
                </p>

                <p
                    id="score"
                    class="score"
                ></p>

                <p class="high-score-text">
                    🏆 High Score:
                    <span id="highScore"></span>
                </p>

                <button
                    id="restartBtn"
                    class="restart-btn"
                >
                    🔄 Ulangi Quiz
                </button>

            </section>

        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
